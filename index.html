<!DOCTYPE html> 
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kadima</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#5A52E5">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- NAČÍTACÍ OBRAZOVKA (Zabrání probliknutí formuláře) -->
  <div id="app-loader">
      <div class="spinner"></div>
  </div>

  <!-- VEŘEJNÁ ČÁST -->
  <div id="public-view" class="hidden">
    
    <!-- NOVÁ ÚVODNÍ OBRAZOVKA PODLE NÁVRHU -->
    <div id="onboarding-screen" class="onboarding-container">
      <div class="onboarding-content">
        <div class="onboarding-logo">
          <svg viewBox="0 0 24 24" width="100" height="100" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 11 12 6 7 11"></polyline>
            <polyline points="17 18 12 13 7 18"></polyline>
          </svg>
        </div>
        <h1 class="onboarding-title">Kadima</h1>
        <p class="onboarding-subtitle">Každý kilometr se počítá.</p>
        <p class="onboarding-desc">Výzvy. Sport. Posun vpřed.</p>
      </div>

      <div class="onboarding-bottom">
        <div class="onboarding-dots">
          <div class="dot active"></div><div class="dot"></div><div class="dot"></div>
        </div>
        <button class="btn-start" onclick="showAuthForm()">Začít</button>
        <p class="login-link">Už máte účet? <span onclick="showAuthForm()">Přihlásit se</span></p>
      </div>
    </div>

    <!-- PŮVODNÍ PŘIHLAŠOVACÍ FORMULÁŘ (skrytý, dokud uživatel neklikne na Začít) -->
    <div id="auth-screen" class="hidden" style="max-width: 400px; margin: 0 auto; padding: 20px;">
      <div style="display:flex; align-items:center; margin-top: 40px; margin-bottom: 20px; cursor: pointer; color: var(--text-gray);" onclick="hideAuthForm()">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" style="margin-right: 8px;"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg> Zpět
      </div>
      <h2 style="font-weight: 800; font-size: 1.8em; margin-bottom: 20px; color: var(--text-dark);">Vítejte zpět</h2>
      <div class="auth-form" style="margin-top:0;">
        <input type="email" id="email-input" class="auth-input" placeholder="Tvůj e-mail">
        
        <div style="position: relative; margin-bottom: 12px;">
          <input type="password" id="password-input" class="auth-input" placeholder="Heslo (min. 6 znaků)" style="margin-bottom:0; padding-right:45px;">
          <div onclick="togglePassword('password-input')" style="position: absolute; right: 15px; top: 15px; cursor: pointer; color: var(--text-gray);">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          </div>
        </div>

        <a href="#" style="display:block; text-align:right; font-size:0.85em; font-weight:600; color:var(--primary-dark); margin-bottom:15px; text-decoration:none;" onclick="resetPassword(event)">Zapomněl(a) jsi heslo?</a>

        <button onclick="loginUser()" class="btn-login" style="background:#5A52E5;">Přihlásit se</button>
        <button onclick="registerUser()" class="btn-register" style="background:var(--primary-dark);">Vytvořit nový účet</button>
        <div style="display:flex; align-items:center; color:var(--text-gray); font-size:0.85em; margin-bottom:15px;">
            <div style="flex:1; height:1px; background:var(--gray-border);"></div><span style="padding:0 10px;">nebo</span><div style="flex:1; height:1px; background:var(--gray-border);"></div>
        </div>
        <button onclick="loginWithGoogle()" class="btn-google">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo" style="width:20px;height:20px;"> Přihlásit se přes Google
        </button>
        <p id="auth-error" style="color:#EF4444; font-size:0.85em; font-weight:600; text-align:center; margin-top:15px; display:none;"></p>
      </div>
    </div>
  </div>

  <!-- SOUKROMÁ ČÁST -->
  <div id="private-view" class="hidden">
      <!-- (Zde je načítán původní obsah dashboardu přes Javascript, pro tento kód to zůstává stejné jako jsi měl) -->
      <!-- OSTATNÍ KÓD (Dashboard, Taby, Navigace) se nemění. Ponech tu VŠE, co následovalo od <div id="tab-dashboard"> až do konce. -->
